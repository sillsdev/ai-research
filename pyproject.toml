[project]
name = "research-site"
version = "0.1.0"
description = "SIL AI Engineering research studies, published as a Quarto website"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pandas>=2.2",
    "plotly>=5.24",
    "pycountry>=24.6",
    "pyyaml>=6.0",
    "quarto-cli>=1.7",
    "tabulate>=0.9",
]

[project.scripts]
rs-import = "research_site.importer:main"
rs-validate = "research_site.validate:main"
rs-check-bucket = "research_site.check_bucket:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_site"]
